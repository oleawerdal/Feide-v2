services:
  openldap:
    build:
      context: ./ldap
    image: feide-openldap:local
    container_name: feide-openldap
    environment:
      LDAP_BASE_DN: dc=skole,dc=kommune,dc=no
      LDAP_DOMAIN: skole.kommune.no
      LDAP_ORG: Skole kommune
      LDAP_ADMIN_PASSWORD: adminpass
      LDAP_LOGLEVEL: "256"
    ports:
      - "1389:389" # ldap (kun for lokal administrasjon/feilsøking)
      - "1636:636" # ldaps (kryptert tilkobling fra portalen)
    volumes:
      - ./certs:/certs:ro
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD-SHELL", "LDAPTLS_REQCERT=never ldapsearch -x -H ldaps://127.0.0.1:636 -D cn=admin,dc=skole,dc=kommune,dc=no -w adminpass -b dc=skole,dc=kommune,dc=no -s base >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  openldap_data:
  openldap_config:
